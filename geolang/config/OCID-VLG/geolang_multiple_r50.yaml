DATA:
  dataset: OCID-VLG
  root_path: ./datasets/OCID-VLG
  train_split: train
  val_split: val
TRAIN:
  # Base Arch
  word_dim: 512
  vis_dim: 512
  fpn_in: [512]
  fpn_out: [512]
  use_pretrained_mamba_clip: True
  mamba_clip_pretrain: /home/tejass/Downloads/TUDELFT_ROBOTICS/Robotics_Q3/CV/HAGRID/geolang/pretrain/VMamba_B_clip.pt
  clip_pretrain: /home/tejass/Downloads/TUDELFT_ROBOTICS/Robotics_Q3/CV/HAGRID/geolang/pretrain/RN50.pt
  version: multiple
  input_size: 416
  word_len: 77
  sync_bn: True # what does this do?
  # DGGM
  use_dggm: True
  dggm_max_tokens: 4096
  # ADCI
  use_adci: True
  adci_align_channels: 512
  adci_out_channels: 512
  adci_groups: 1
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 2048
  dropout: 0.1
  intermediate: False
  # Training Setting
  workers: 2  # data loader workers
  workers_val: 2
  epochs: 50
  milestones: [35]
  start_epoch: 0
  batch_size: 2  # batch size for training
  batch_size_val: 24  # batch size for validation during training, memory and speed tradeoff
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 0.1
  weight_decay: 0.
  max_norm: 0.
  manual_seed: 0
  print_freq: 100
  # Resume & Save
  exp_name: CROG_multiple_R50
  output_folder: exp/OCID-VLG_multiple
  save_freq: 1
  weight:  # path to initial weight (default: none)
  resume:  
  evaluate: True  # evaluate on validation set, extra gpu memory needed and small batch_size_val is recommend
  # Ablation study
  use_contrastive: True
  use_pretrained_clip: True
  use_grasp_masks: True
  # Weights & Biases
  use_wandb: True
  wandb_mode: offline
  wandb_project: Geolang
Distributed:
  dist_url: tcp://localhost:3681
  dist_backend: 'nccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: val-test
  visualize: False